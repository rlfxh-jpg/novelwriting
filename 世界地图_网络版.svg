<svg width="1800" height="1120" viewBox="0 0 1800 1120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5ecd7"/>
      <stop offset="100%" stop-color="#dfcca6"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#bfdde9"/>
      <stop offset="100%" stop-color="#83b3cc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
    <style>
      .title { font: 700 36px 'Microsoft YaHei','PingFang SC','SimHei',sans-serif; fill: #3d2d1f; }
      .subtitle { font: 500 18px 'Microsoft YaHei','PingFang SC','SimHei',sans-serif; fill: #5d4b36; }
      .country { font: 700 22px 'Microsoft YaHei','PingFang SC','SimHei',sans-serif; fill: #241b12; }
      .region { font: italic 700 26px 'Microsoft YaHei','PingFang SC','SimHei',sans-serif; fill: #2d617d; }
      .city { font: 600 15px 'Microsoft YaHei','PingFang SC','SimHei',sans-serif; fill: #211810; }
      .legend { font: 600 16px 'Microsoft YaHei','PingFang SC','SimHei',sans-serif; fill: #2d241d; }
      .note { font: 500 13px 'Microsoft YaHei','PingFang SC','SimHei',sans-serif; fill: #4f4232; }
      .tiny { font: 500 12px 'Microsoft YaHei','PingFang SC','SimHei',sans-serif; fill: #4f4232; }
    </style>
  </defs>

  <rect width="1800" height="1120" fill="url(#paper)"/>

