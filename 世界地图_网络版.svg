  <!-- Title -->
  <rect x="44" y="42" width="770" height="112" rx="14" fill="#f8f0db" opacity="0.94" stroke="#8d7a5d" stroke-width="2"/>
  <text x="68" y="86" class="title">世界地图 V3 · 网络版</text>
  <text x="70" y="116" class="subtitle">以公共节点、中继塔、门链主干网、黑市线路、镜像仓库与能源干线为重点的分层地图</text>

  <!-- Compass -->
  <g transform="translate(1548,114)">
    <circle cx="0" cy="0" r="56" fill="#f8f0db" stroke="#7a6851" stroke-width="3"/>
    <path d="M0,-42 L9,0 L0,42 L-9,0 Z" fill="#7a6851"/>
    <path d="M-42,0 L0,9 L42,0 L0,-9 Z" fill="#7a6851"/>
    <text x="-8" y="-64" class="legend">北</text>
    <text x="58" y="6" class="legend">东</text>
    <text x="-8" y="83" class="legend">南</text>
    <text x="-68" y="6" class="legend">西</text>
  </g>

  <!-- legend -->
  <g transform="translate(1360,194)">
    <rect x="0" y="0" width="390" height="550" rx="16" fill="#f8f0db" opacity="0.95" stroke="#8c7a5d" stroke-width="2"/>
    <text x="18" y="34" class="country" font-size="22">网络图例</text>

    <circle cx="34" cy="70" r="11" fill="#26a269" stroke="#e7f8ed" stroke-width="2"/>
    <text x="60" y="75" class="legend">公共节点（已上线 / 高潜力）</text>

    <rect x="29" y="100" width="10" height="16" rx="2" fill="#35698c" stroke="#f6e6c9" stroke-width="1.2"/>
    <text x="60" y="113" class="legend">中继塔 / 观测塔 / 线路塔</text>

    <polygon points="34,132 42,144 34,156 26,144" fill="#d28c2d" stroke="#fff3da" stroke-width="1.4"/>
    <text x="60" y="147" class="legend">术式仓库镜像站</text>

    <line x1="20" y1="180" x2="48" y2="180" stroke="#6952d8" stroke-width="7"/>
    <circle cx="34" cy="180" r="5" fill="#6952d8"/>
    <text x="60" y="185" class="legend">官方门链主干网</text>

    <line x1="20" y1="214" x2="48" y2="214" stroke="#21a366" stroke-width="5"/>
    <text x="60" y="219" class="legend">公共节点主干连接</text>

    <line x1="20" y1="248" x2="48" y2="248" stroke="#2e6f93" stroke-width="4" stroke-dasharray="10 8"/>
    <text x="60" y="253" class="legend">中继塔链 / 网络骨架</text>

    <line x1="20" y1="282" x2="48" y2="282" stroke="#25202c" stroke-width="5" stroke-dasharray="9 8" opacity="0.5"/>
    <text x="60" y="287" class="legend">黑市 / 暗影议会地下线路</text>

    <line x1="20" y1="316" x2="48" y2="316" stroke="#a05b24" stroke-width="4.5"/>
    <text x="60" y="321" class="legend">能源主干运输线</text>

    <line x1="20" y1="350" x2="48" y2="350" stroke="#38b77a" stroke-width="3.5" stroke-dasharray="8 7"/>
    <text x="60" y="355" class="legend">主角路线下的公共扩张方向</text>

    <text x="20" y="400" class="note">阅读重点：</text>
    <text x="20" y="420" class="note">1. 旧世界最强的是门链、议会节点和家族网关。</text>
    <text x="20" y="440" class="note">2. 主角路线最先从学院城 → 港口 → 样板城长出。</text>
    <text x="20" y="460" class="note">3. 镜湖海中区是“公共网络”最合理的起爆点。</text>
    <text x="20" y="480" class="note">4. 黑市线路和官方主干网互相依附又互相咬合。</text>
    <text x="20" y="500" class="note">5. 真相层最终会把全部网络重新指向沉环渊深处。</text>
  </g>

  <!-- Footer -->
  <text x="50" y="1068" class="note">建议下一步继续制作：`世界地图_剧情路线版.svg`，把第一卷到第五卷的角色行动、战争升级、公共节点扩张和真相探索路线分别分层画出来。</text>
</svg>
