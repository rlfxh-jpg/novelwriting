      .region { font: italic 700 28px 'Microsoft YaHei','PingFang SC','SimHei',sans-serif; fill: #295d79; }
      .country { font: 700 24px 'Microsoft YaHei','PingFang SC','SimHei',sans-serif; fill: #21170f; }
      .city { font: 600 16px 'Microsoft YaHei','PingFang SC','SimHei',sans-serif; fill: #1a1a1a; }
      .note { font: 500 14px 'Microsoft YaHei','PingFang SC','SimHei',sans-serif; fill: #4b3b2c; }
      .legend { font: 600 16px 'Microsoft YaHei','PingFang SC','SimHei',sans-serif; fill: #2d241c; }
      .tiny { font: 500 13px 'Microsoft YaHei','PingFang SC','SimHei',sans-serif; fill: #4b3d30; }
    </style>
  </defs>

