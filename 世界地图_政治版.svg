  <g transform="translate(1548,114)">
    <circle cx="0" cy="0" r="56" fill="#f8f0db" stroke="#7a6851" stroke-width="3"/>
    <path d="M0,-42 L9,0 L0,42 L-9,0 Z" fill="#7a6851"/>
