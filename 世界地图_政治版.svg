    <circle cx="34" cy="356" r="7" fill="#8b2e2e"/>
    <text x="62" y="361" class="legend">关键学院 / 港口 / 门站 / 遗迹</text>

    <text x="20" y="404" class="note">本图优先回答：</text>
    <text x="20" y="424" class="note">谁控制哪里、哪里是谁的喉咙、</text>
    <text x="20" y="444" class="note">哪片区域天然是缓冲区、哪条线</text>
    <text x="20" y="464" class="note">一旦断掉就会引发全球级震荡。</text>
  </g>

  <!-- footer -->
  <text x="50" y="1068" class="note">建议下一步继续制作：`世界地图_网络版.svg`，把公共节点、中继塔、门链、黑市节点和仓库镜像站全部单独分层画出来。</text>
