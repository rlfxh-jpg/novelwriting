<svg width="1800" height="1120" viewBox="0 0 1800 1120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5ecd6"/>
      <stop offset="100%" stop-color="#dfcca5"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c6e2ee"/>
      <stop offset="100%" stop-color="#8cb8cf"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
    <pattern id="dispute" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#8c3c2f" stroke-width="2" opacity="0.35"/>
    </pattern>
    <style>
      .title { font: 700 36px 'Microsoft YaHei','PingFang SC','SimHei',sans-serif; fill: #3d2d1f; }
      .subtitle { font: 500 18px 'Microsoft YaHei','PingFang SC','SimHei',sans-serif; fill: #5d4a35; }
      .country { font: 700 24px 'Microsoft YaHei','PingFang SC','SimHei',sans-serif; fill: #1f1812; }
      .region { font: italic 700 28px 'Microsoft YaHei','PingFang SC','SimHei',sans-serif; fill: #2f617d; }
      .capital { font: 700 17px 'Microsoft YaHei','PingFang SC','SimHei',sans-serif; fill: #201712; }
      .site { font: 600 15px 'Microsoft YaHei','PingFang SC','SimHei',sans-serif; fill: #2a2118; }
      .legend { font: 600 16px 'Microsoft YaHei','PingFang SC','SimHei',sans-serif; fill: #2c241c; }
      .note { font: 500 13px 'Microsoft YaHei','PingFang SC','SimHei',sans-serif; fill: #4d4031; }
      .tiny { font: 500 12px 'Microsoft YaHei','PingFang SC','SimHei',sans-serif; fill: #4d4031; }
    </style>
  </defs>

  <rect width="1800" height="1120" fill="url(#paper)"/>

